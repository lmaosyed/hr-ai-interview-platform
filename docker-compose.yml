services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLIC_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PUBLIC_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMTP_PUBLIC_PORT:-51025}:1025"
      - "127.0.0.1:${MAILBOX_PORT:-58025}:8025"

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-55173}
      MAILBOX_PREVIEW_URL: http://localhost:${MAILBOX_PORT:-58025}
      DEMO_MODE: ${DEMO_MODE}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER}
    command: >
      sh -c "python -m backend.scripts.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:${API_PORT:-58000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ${STORAGE_PATH:-./storage}:/app/storage

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    command: python -m backend.services.worker
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from redis import Redis; from backend.core.config import get_settings; value = Redis.from_url(get_settings().redis_url).get('interview_worker_heartbeat'); raise SystemExit(0 if value and time.time() - float(value) < 45 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      fastapi:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ${STORAGE_PATH:-./storage}:/app/storage

  airflow-init:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    profiles: ["airflow"]
    env_file:
      - .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      PYTHONPATH: /opt/airflow
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      DEMO_MODE: ${DEMO_MODE}
    command: >
      bash -c "airflow db migrate &&
               airflow users create
               --username admin
               --password admin
               --firstname Demo
               --lastname Admin
               --role Admin
               --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ${STORAGE_PATH:-./storage}:/opt/airflow/storage

  airflow-webserver:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *airflow-env
    command: airflow webserver
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      - airflow-init
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ${STORAGE_PATH:-./storage}:/opt/airflow/storage

  airflow-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *airflow-env
    command: airflow scheduler
    depends_on:
      - airflow-init
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ${STORAGE_PATH:-./storage}:/opt/airflow/storage

  airflow-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *airflow-env
    command: airflow celery worker
    depends_on:
      - airflow-init
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ${STORAGE_PATH:-./storage}:/opt/airflow/storage

  react:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://fastapi:8000
    command: sh -c "npm ci && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-55173}:5173"
    depends_on:
      - fastapi
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
