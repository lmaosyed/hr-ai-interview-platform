services:
  postgres:
    image: postgres:16
    container_name: hr-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: hr-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: hr-mailpit
    restart: unless-stopped
    ports:
      - "51025:1025"
      - "58025:8025"

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hr-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:55173
      DEMO_MODE: ${DEMO_MODE}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER}
    command: >
      sh -c "python -m backend.scripts.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "58000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    command: python -m backend.services.worker
    depends_on:
      fastapi:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage

  airflow-init:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    container_name: hr-airflow-init
    profiles: ["airflow"]
    env_file:
      - .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      PYTHONPATH: /opt/airflow
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      DEMO_MODE: ${DEMO_MODE}
    command: >
      bash -c "airflow db migrate &&
               airflow users create
               --username admin
               --password admin
               --firstname Demo
               --lastname Admin
               --role Admin
               --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage

  airflow-webserver:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    container_name: hr-airflow-webserver
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *airflow-env
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage

  airflow-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    container_name: hr-airflow-scheduler
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *airflow-env
    command: airflow scheduler
    depends_on:
      - airflow-init
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage

  airflow-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.airflow
    container_name: hr-airflow-worker
    profiles: ["airflow"]
    restart: unless-stopped
    env_file:
      - .env
    environment: *airflow-env
    command: airflow celery worker
    depends_on:
      - airflow-init
    volumes:
      - ./backend:/opt/airflow/backend
      - ./backend/dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage

  react:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hr-react
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:58000/api
    command: sh -c "npm ci && npm run dev"
    ports:
      - "55173:5173"
    depends_on:
      - fastapi
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
